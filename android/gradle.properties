# JVM & Gradle Memory Optimization for Low-RAM Systems (6GB RAM)
# Limits heap to 1024M and uses ParallelGC to avoid large contiguous mmap allocations
org.gradle.jvmargs=-Xms256M -Xmx1024M -XX:MaxMetaspaceSize=256M -XX:ReservedCodeCacheSize=128M -XX:+UseParallelGC -Dorg.gradle.daemon.performance.enable-monitoring=false

# Disable daemon health check self-termination on memory-constrained systems
org.gradle.daemon.health.check=false

# Limit worker count to 1 to prevent multiple parallel Gradle JVM workers
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.daemon=false

# Run Kotlin compiler inside the Gradle JVM instead of spawning an external Kotlin daemon JVM
kotlin.compiler.execution.strategy=in-process

# AndroidX is enabled
android.useAndroidX=true
# Disable Jetifier to eliminate heavy bytecode translation memory overhead
android.enableJetifier=false
